[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resource-radar"
version = "0.9.0"
description = "Daily-verified global free AI APIs, GPU compute, grants, and prices with regional availability"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AI Resource Radar contributors"}]
keywords = ["ai", "gpu", "tokens", "pricing", "free-tier", "price-tracker", "local-first"]
dependencies = ["Pillow>=10,<13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://ai-resource-radar.github.io/ai-resource-radar/"
Repository = "https://github.com/ai-resource-radar/ai-resource-radar"
Issues = "https://github.com/ai-resource-radar/ai-resource-radar/issues"

[project.scripts]
ai-radar = "ai_resource_radar.cli:main"
ai-resource-radar = "ai_resource_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_resource_radar = [
  "native/*.swift",
  "frontend_shared/*.css",
  "frontend_shared/*.js",
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/*.svg",
  "web/modules/*.js",
  "web/modules/views/*.js",
  "web/styles/*.css",
  "public_web/*.html",
  "public_web/*.css",
  "public_web/*.js",
  "public_web/*.txt",
  "public_web/*.xml",
  "public_web/*.svg",
  "public_web/*.png",
  "public_web/modules/*.js",
  "public_web/styles/*.css",
]
