name: Publish public radar

on:
  push:
    branches:
      - main
  schedule:
    # Primary refresh shortly after the UTC day starts; the later run is a
    # fallback for a missed or unhealthy primary publication.
    - cron: "37 0 * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore source cadence and fetch every allow-listed source"
        required: false
        default: true
        type: boolean

# The deploy action needs Pages write access and an OIDC token. Collection is
# keyless. Public analytics and Google Search Console verification are supplied
# only to the production site build; neither token is used by collectors or the
# local dashboard.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fallback_check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check live fallback snapshot
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FALLBACK_CRON: "17 3 * * *"
          LIVE_MANIFEST_URL: https://ai-resource-radar.github.io/ai-resource-radar/data/manifest.json
        run: |
          set +e
          skip=false
          reason=not_fallback

          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "$FALLBACK_CRON" ]]; then
            if curl --fail --silent --show-error --location --max-time 30 \
              "$LIVE_MANIFEST_URL" --output live-manifest.json; then
              if reason="$(python3 .github/scripts/pages_fallback_guard.py live-manifest.json)"; then
                skip=true
              else
                [[ -n "$reason" ]] || reason=manifest_parse_failed
              fi
            else
              reason=manifest_fetch_failed
            fi
          fi

          {
            echo "skip=$skip"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          echo "fallback decision: skip=$skip reason=$reason"
          # An unavailable, malformed, old, or unhealthy live snapshot must
          # fall through to the normal refresh rather than fail this check.
          exit 0

  build:
    needs: fallback_check
    if: needs.fallback_check.result == 'success' && needs.fallback_check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Prepare CI-only SQLite cache
        run: mkdir -p .ci-cache

      - name: Restore CI-only SQLite database
        uses: actions/cache@v4
        with:
          path: .ci-cache/radar.sqlite3
          key: pages-radar-sqlite-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            pages-radar-sqlite-${{ runner.os }}-${{ github.ref_name }}-
            pages-radar-sqlite-${{ runner.os }}-

      - name: Refresh public data (keyless)
        id: refresh
        env:
          RADAR_DB: .ci-cache/radar.sqlite3
          RADAR_FORCE: ${{ github.event_name != 'workflow_dispatch' || inputs.force }}
        run: |
          set +e
          refresh_args=(--database "$RADAR_DB")
          if [[ "$RADAR_FORCE" == "true" ]]; then
            refresh_args+=(--force)
          fi
          ai-radar refresh "${refresh_args[@]}" > refresh-report.json
          refresh_code=$?
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("refresh-report.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["refresh_mode"] = "forced" if os.environ.get("RADAR_FORCE") == "true" else "cadence"
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          set -e
          echo "exit_code=$refresh_code" >> "$GITHUB_OUTPUT"
          # A source-level partial report is safe for the site builder to
          # represent. Unsupported-schema and other hard failures stop here.
          if (( refresh_code > 1 )); then
            cat refresh-report.json
            exit "$refresh_code"
          fi
          cat refresh-report.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build public site
        env:
          AI_RADAR_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          AI_RADAR_GOOGLE_SITE_VERIFICATION_TOKEN: ${{ secrets.GOOGLE_SITE_VERIFICATION_TOKEN }}
        run: |
          if [[ -z "$AI_RADAR_CLOUDFLARE_ANALYTICS_TOKEN" ]]; then
            echo "pages_gate_missing_cloudflare_analytics_token" >&2
            exit 1
          fi
          ai-radar site build \
            --database .ci-cache/radar.sqlite3 \
            --output _site \
            --base-url https://ai-resource-radar.github.io/ai-resource-radar/ \
            --source-revision "${GITHUB_SHA}" \
            --refresh-report refresh-report.json \
            --analytics-provider cloudflare \
            --search-console-provider google

      - name: Verify public site and publication gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("_site")
          index = root / "index.html"
          manifest = root / "data/manifest.json"
          if not index.is_file() or index.stat().st_size == 0:
              raise SystemExit("pages_gate_missing_index")
          if not manifest.is_file() or manifest.stat().st_size == 0:
              raise SystemExit("pages_gate_missing_manifest")
          payload = json.loads(manifest.read_text(encoding="utf-8"))
          refresh_report_path = Path("refresh-report.json")
          if not refresh_report_path.is_file() or refresh_report_path.stat().st_size == 0:
              raise SystemExit("pages_gate_missing_refresh_report")
          refresh_report = json.loads(refresh_report_path.read_text(encoding="utf-8"))
          report_sources = refresh_report.get("sources")
          if not isinstance(report_sources, list) or len(report_sources) != 23:
              raise SystemExit("pages_gate_source_attempts")
          source_ids = [
              item.get("source_id")
              for item in report_sources
              if isinstance(item, dict)
          ]
          if len(source_ids) != 23 or len(set(source_ids)) != 23 or any(not source_id for source_id in source_ids):
              raise SystemExit("pages_gate_source_attempts")
          status = payload.get("status")
          if status not in {"healthy", "partial"}:
              raise SystemExit(f"pages_gate_rejected_status:{status!r}")
          if payload.get("publishable") is False:
              raise SystemExit("pages_gate_not_publishable")
          if payload.get("source_revision") != "${{ github.sha }}":
              raise SystemExit("pages_gate_revision_mismatch")
          if int(payload.get("data_age_seconds") or 999999) > 1800:
              raise SystemExit("pages_gate_data_too_old")
          health = payload.get("source_health") or {}
          if health.get("total") != 23 or health.get("stale") or health.get("never"):
              raise SystemExit("pages_gate_source_health")
          if payload.get("analytics_provider") != "cloudflare":
              raise SystemExit("pages_gate_analytics_missing")
          if payload.get("search_console_provider") != "google":
              raise SystemExit("pages_gate_search_console_missing")
          scenario_pages = payload.get("scenario_pages")
          if isinstance(scenario_pages, dict):
              scenario_routes = scenario_pages.get("pages") or scenario_pages.get("urls") or []
              scenario_count = scenario_pages.get("count", len(scenario_routes))
          elif isinstance(scenario_pages, list):
              scenario_count = len(scenario_pages)
          else:
              scenario_count = 0
          if int(scenario_count or 0) != 12:
              raise SystemExit("pages_gate_scenario_pages")
          feeds = payload.get("feeds")
          if isinstance(feeds, dict):
              feed_count = sum(
                  len(value) for value in feeds.values() if isinstance(value, list)
              )
          elif isinstance(feeds, list):
              feed_count = len(feeds)
          else:
              feed_count = 0
          if feed_count != 4:
              raise SystemExit("pages_gate_feeds")
          if not payload.get("experiment_started_at"):
              raise SystemExit("pages_gate_experiment_start")
          index_text = index.read_text(encoding="utf-8")
          if index_text.count("static.cloudflareinsights.com/beacon.min.js") != 1:
              raise SystemExit("pages_gate_analytics_beacon_count")
          if index_text.count('name="google-site-verification"') != 1:
              raise SystemExit("pages_gate_search_console_marker")
          for required in (
              "data/providers.json", "data/integrations.json", "data/featured.json",
              "zh/providers/openrouter/index.html", "en/providers/openrouter/index.html",
              "feed.xml", "rss.xml", "en/feed.xml", "en/rss.xml",
              "zh/scenarios/free-ai-api-no-card/index.html",
              "en/scenarios/free-ai-api-no-card/index.html",
              "zh/scenarios/recurring-free-ai-api/index.html",
              "en/scenarios/recurring-free-ai-api/index.html",
              "zh/scenarios/free-gpu-compute/index.html",
              "en/scenarios/free-gpu-compute/index.html",
              "zh/scenarios/mainland-supported-free-ai-api/index.html",
              "en/scenarios/mainland-supported-free-ai-api/index.html",
              "zh/scenarios/free-image-generation-api/index.html",
              "en/scenarios/free-image-generation-api/index.html",
              "zh/scenarios/openai-compatible-free-ai-api/index.html",
              "en/scenarios/openai-compatible-free-ai-api/index.html",
          ):
              if not (root / required).is_file():
                  raise SystemExit(f"pages_gate_missing_v07_asset:{required}")
          print(f"public site gate: {status}")
          print(f"files: {payload.get('files', [])}")
          print(f"source health: {payload.get('source_health', {})}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs:
      - fallback_check
      - build
    if: needs.fallback_check.result == 'success' && needs.fallback_check.outputs.skip != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
