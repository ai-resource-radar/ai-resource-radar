name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q src
      - run: node --check src/ai_resource_radar/web/ai-resources.js
      - run: node --check src/ai_resource_radar/public_web/app.js

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile native helpers
        run: |
          mkdir -p /tmp/ai-radar-swift-cache
          swiftc -module-cache-path /tmp/ai-radar-swift-cache -O src/ai_resource_radar/native/macos_poster_ocr.swift -framework Vision -framework ImageIO -framework CoreGraphics -o /tmp/ai-radar-ocr
          swiftc -module-cache-path /tmp/ai-radar-swift-cache -O src/ai_resource_radar/native/macos_menubar.swift -framework AppKit -o /tmp/ai-radar-menubar

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify the wheel in a clean environment
        run: |
          python -m venv /tmp/ai-radar-wheel-smoke
          /tmp/ai-radar-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/ai-radar-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/ai-radar-wheel-smoke/bin/ai-radar --help
          /tmp/ai-radar-wheel-smoke/bin/ai-radar site --help
          /tmp/ai-radar-wheel-smoke/bin/ai-resource-radar start --help
          /tmp/ai-radar-wheel-smoke/bin/ai-radar poster models --json
          /tmp/ai-radar-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files
          root = files("ai_resource_radar").joinpath("public_web")
          for name in ("index.html", "styles.css", "app.js"):
              assert root.joinpath(name).is_file(), name
          PY
      - name: Create checksums
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
