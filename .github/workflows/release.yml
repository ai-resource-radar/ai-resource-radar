name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q src
      - run: node --check src/ai_resource_radar/web/ai-resources.js

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile native helpers
        run: |
          mkdir -p /tmp/ai-radar-swift-cache
          swiftc -module-cache-path /tmp/ai-radar-swift-cache -O src/ai_resource_radar/native/macos_poster_ocr.swift -framework Vision -framework ImageIO -framework CoreGraphics -o /tmp/ai-radar-ocr
          swiftc -module-cache-path /tmp/ai-radar-swift-cache -O src/ai_resource_radar/native/macos_menubar.swift -framework AppKit -o /tmp/ai-radar-menubar

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [core, macos, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Match package and tag versions
        run: |
          python - <<'PY'
          import pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = "${{ github.ref_name }}"
          if tag != f"v{version}" or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/ai-radar-release-smoke
          /tmp/ai-radar-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/ai-radar-release-smoke/bin/ai-radar --help
          /tmp/ai-radar-release-smoke/bin/ai-radar poster models --json
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-resource-radar
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-github:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: dist/
      - name: Verify downloaded release artifacts
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes --title "AI Resource Radar ${{ github.ref_name }}"
