name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q src
      - name: Check all browser modules
        run: find src/ai_resource_radar/web src/ai_resource_radar/public_web src/ai_resource_radar/frontend_shared -name '*.js' -type f -print0 | xargs -0 -n1 node --check

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile native helpers
        run: |
          mkdir -p /tmp/ai-radar-swift-cache
          swiftc -module-cache-path /tmp/ai-radar-swift-cache -O src/ai_resource_radar/native/macos_poster_ocr.swift -framework Vision -framework ImageIO -framework CoreGraphics -o /tmp/ai-radar-ocr
          swiftc -module-cache-path /tmp/ai-radar-swift-cache -O src/ai_resource_radar/native/macos_menubar.swift -framework AppKit -o /tmp/ai-radar-menubar

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with the open-source Gitleaks CLI
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source . --redact --verbose --no-banner

  build:
    needs: [core, macos, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Match package and tag versions
        run: |
          python - <<'PY'
          import pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = "${{ github.ref_name }}"
          if tag != f"v{version}" or not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          python -m venv /tmp/ai-radar-release-smoke
          /tmp/ai-radar-release-smoke/bin/python -m pip install dist/*.whl
          /tmp/ai-radar-release-smoke/bin/ai-radar --help
          /tmp/ai-radar-release-smoke/bin/ai-radar site --help
          /tmp/ai-radar-release-smoke/bin/ai-resource-radar start --help
          /tmp/ai-radar-release-smoke/bin/ai-radar poster models --json
          /tmp/ai-radar-release-smoke/bin/python - <<'PY'
          from importlib.resources import files
          root = files("ai_resource_radar").joinpath("public_web")
          for name in (
              "index.html",
              "styles.css",
              "app.js",
              "provider.css",
              "provider.js",
          ):
              assert root.joinpath(name).is_file(), name
          dashboard = files("ai_resource_radar").joinpath("web")
          for name in (
              "index.html",
              "modules/api.js",
              "modules/views/pricing.js",
              "styles/tokens.css",
              "styles/responsive.css",
          ):
              assert dashboard.joinpath(name).is_file(), name
          shared = files("ai_resource_radar").joinpath("frontend_shared")
          for name in ("cards.js", "cards.css", "dom.js", "formatters.js", "radar-tokens.css"):
              assert shared.joinpath(name).is_file(), name
          PY
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-resource-radar
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-github:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: dist/
      - name: Verify downloaded release artifacts
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --verify-tag --generate-notes --title "AI Resource Radar ${{ github.ref_name }}"
